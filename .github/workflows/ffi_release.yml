name: Release FFI Library

on:
  release:
    types: [published]

jobs:
  build:
    name: Cross-compile Rust Library
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
          - x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: ${{ matrix.target }}

      - name: Install dependencies for cross-compilation
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64

      - name: change directory to FFI
        run: cd ffi

      - name: Build library
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/lib* artifacts/ || echo "No matching library files"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          name: "Artifacts for ${{ matrix.target }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
