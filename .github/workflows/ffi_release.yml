name: Release FFI Library

on:
  release:
    types: [published]

jobs:
  build:
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: x86_64-linux-gnu
            shared_ext: so
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: x86_64-linux-musl
            shared_ext: so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: arm64-linux-gnu
            shared_ext: so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: x86_64-windows
            shared_ext: dll
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: x86_64-darwin
            shared_ext: dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: arm64-darwin
            shared_ext: dylib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install MUSL tools (for MUSL only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools protobuf-compiler

      - name: Install GCC for AArch64 (Linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu protobuf-compiler

      - name: Build shared library
        working-directory: ffi
        run: |
          export RUSTFLAGS="-C prefer-dynamic"
          cargo build --release --target ${{ matrix.target }}

      - name: Rename output shared library
        working-directory: ffi
        run: |
          mkdir output
          libname=$(basename target/${{ matrix.target }}/release/*.${{ matrix.shared_ext }})
          cp target/${{ matrix.target }}/release/$libname output/libvalkeyglide-${{ matrix.suffix }}.${{ matrix.shared_ext }}

      - name: Generate checksum
        working-directory: ffi
        run: |
          cd output
          sha256sum libvalkeyglide-${{ matrix.suffix }}.${{ matrix.shared_ext }} > libvalkeyglide-${{ matrix.suffix }}.${{ matrix.shared_ext }}.sha256

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ffi/output/libvalkeyglide-${{ matrix.suffix }}.${{ matrix.shared_ext }}
            ffi/output/libvalkeyglide-${{ matrix.suffix }}.${{ matrix.shared_ext }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
